<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Mi día · Agente</title>
<style>
*{box-sizing:border-box}body{margin:0;font:19px/1.45 system-ui,sans-serif;background:#f1f5f9;color:#0f172a}
.top{background:#0f766e;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.top h1{margin:0;font-size:24px}
.top button{background:#fff;color:#0f766e;border:0;border-radius:10px;padding:8px 12px;font-size:16px;font-weight:700}
.demo{background:#fef3c7;color:#713f12;font-size:14px;padding:8px 16px;font-weight:600}
main{max-width:720px;margin:0 auto;padding:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tabs button{padding:16px 8px;font-size:18px;font-weight:700;border-radius:14px;border:3px solid #cbd5e1;background:#fff}.tabs button.on{border-color:#0f766e;background:#ccfbf1}
.tabs .n{display:inline-block;min-width:28px;background:#dc2626;color:#fff;border-radius:999px;font-size:15px;margin-left:4px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.card.done{opacity:.5}
.card h3{margin:0 0 4px;font-size:21px}.card .meta{color:#475569;font-size:16px}.tag{display:inline-block;background:#e2e8f0;border-radius:6px;padding:0 6px;font-size:13px;margin-left:4px;vertical-align:middle}.tag.s{background:#fde68a}.tag.w{background:#bbf7d0}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.acts a,.acts button{display:block;text-align:center;padding:14px 4px;border-radius:12px;font-size:17px;font-weight:700;text-decoration:none;border:0}
.call{background:#0f766e;color:#fff}.text{background:#e0f2f1;color:#0f766e}.ok{background:#16a34a;color:#fff}
textarea{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:1px solid #cbd5e1;margin-top:8px}
.mic{margin-top:6px;background:#fff;border:2px solid #0f766e;color:#0f766e;border-radius:10px;padding:10px;font-size:16px;font-weight:700;width:100%}.mic.rec{background:#dc2626;color:#fff;border-color:#dc2626}
#gate{max-width:360px;margin:60px auto;padding:20px;text-align:center}#gate input{font-size:28px;text-align:center;width:100%;padding:12px;border-radius:12px;border:2px solid #cbd5e1;letter-spacing:6px}
#gate button{margin-top:12px;width:100%;padding:16px;font-size:20px;font-weight:700;background:#0f766e;color:#fff;border:0;border-radius:12px}.err{color:#dc2626}
.empty{text-align:center;color:#64748b;padding:24px}.foot{font-size:14px;color:#64748b;text-align:center;margin:16px 0}.foot button{font-size:14px}
</style></head><body>
<div id="gate"><h1 data-i="gateH"></h1><p class="demo" data-i="gateDemo"></p><input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN"><button id="go" data-i="enter"></button><p class="err" id="perr"></p></div>
<div id="app" hidden>
<div class="top"><h1 data-i="title"></h1><div><button id="lang">English</button> <button id="out" data-i="out"></button></div></div>
<div class="demo" data-i="demo"></div>
<main><p id="today" style="margin:4px 0 12px;font-weight:600"></p>
<div class="tabs"><button data-t="book"></button><button data-t="call"></button><button data-t="renew"></button><button data-t="miss"></button></div>
<div id="list"></div>
<div class="foot"><button id="showDone"></button> · <button id="reset" data-i="reset"></button></div></main></div>
<script>
/* DEMO ONLY — passcode is visible in this file. NOT secure. Real client data needs a real login + server database. */
const PASSCODE="1234";
const T={es:{gateH:"Mi día",gateDemo:"DEMO — código de prueba, no es seguro.",enter:"Entrar",bad:"Código incorrecto",title:"☀️ Mi día",out:"Salir",
demo:"DEMOSTRACIÓN: datos de ejemplo guardados solo en este teléfono/navegador. Las llamadas perdidas son de ejemplo (sin Twilio).",
book:"📅 Citas hoy",call:"📞 Devolver llamada",renew:"🔁 Renovaciones",miss:"📵 Perdidas",cCall:"Llamar",cText:"Texto",cDone:"✓ Listo",cUndo:"Deshacer",
note:"Notas…",mic:"🎤 Dictar nota",micStop:"⏹ Parar",noMic:"Dictado no disponible en este navegador",sample:"Ejemplo",web:"Del sitio web",
empty:"¡Nada pendiente! 🎉",showDone:"Ver terminados",hideDone:"Ocultar terminados",reset:"Restablecer ejemplo",confirm:"¿Borrar cambios y volver a los datos de ejemplo?",
due:"Vence",at:"Hora",reasonL:"Motivo",ago:"Llamó",sms:"Hola, soy su agente de seguros. Le llamo pronto."},
en:{gateH:"My Day",gateDemo:"DEMO — test passcode, not secure.",enter:"Enter",bad:"Wrong code",title:"☀️ My Day",out:"Log out",
demo:"DEMO: sample data stored only on this phone/browser. Missed calls are placeholders (no Twilio).",
book:"📅 Today",call:"📞 Callbacks",renew:"🔁 Renewals",miss:"📵 Missed",cCall:"Call",cText:"Text",cDone:"✓ Done",cUndo:"Undo",
note:"Notes…",mic:"🎤 Dictate note",micStop:"⏹ Stop",noMic:"Dictation not supported in this browser",sample:"Sample",web:"From website",
empty:"Nothing left! 🎉",showDone:"Show done",hideDone:"Hide done",reset:"Reset sample",confirm:"Erase changes and restore sample data?",
due:"Due",at:"Time",reasonL:"Reason",ago:"Called",sms:"Hi, this is your insurance agent. I'll call you soon."}};
const today=new Date(),iso=d=>d.toISOString().slice(0,10),plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const SAMPLE=()=>({
book:[{id:"b1",name:"Rosa Martínez (ejemplo)",phone:"2095550101",time:"10:00",what:"Renovar plan familiar"},{id:"b2",name:"Gurpreet Singh (sample)",phone:"2095550102",time:"1:30",what:"Primera inscripción"},{id:"b3",name:"José Hernández (ejemplo)",phone:"2095550103",time:"4:00",what:"Le subió el recibo"}],
call:[{id:"c1",name:"Ana López (ejemplo)",phone:"2095550104",what:"Perdí Medi-Cal",when:"Mañana (9–12)"}],
renew:[{id:"r1",name:"Familia García (ejemplo)",phone:"2095550105",due:plus(12),what:"Silver 87 · Blue Shield"},{id:"r2",name:"Harjit Kaur (sample)",phone:"2095550106",due:plus(25),what:"Bronze · Anthem"},{id:"r3",name:"Luis Ramírez (ejemplo)",phone:"2095550107",due:plus(40),what:"Silver 73 · Kaiser"}],
miss:[{id:"m1",name:"(209) 555-0108",phone:"2095550108",when:"9:12 AM"},{id:"m2",name:"(209) 555-0109",phone:"2095550109",when:"11:47 AM"}],
done:{},notes:{}});
const KEY="cca-agent-demo-v1";let S,lang=localStorage.getItem("cca-agent-lang")||"es",tab="book",showDone=false,rec=null;
const load=()=>{try{S=JSON.parse(localStorage.getItem(KEY))}catch{}if(!S)S=SAMPLE()},save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function webLeads(){try{return JSON.parse(localStorage.getItem("cca-leads")||"[]").map(l=>({id:"w"+l.id,name:l.name,phone:l.phone,what:l.reason+(l.notes?" — "+l.notes:""),when:(l.day||"")+" "+(l.time||""),web:true}))}catch{return[]}}
function items(t){return t==="call"?[...webLeads(),...S.call]:S[t]}
function render(){const t=T[lang];document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);$("#lang").textContent=lang==="es"?"English":"Español";
 $("#today").textContent=today.toLocaleDateString(lang==="es"?"es-MX":"en-US",{weekday:"long",month:"long",day:"numeric"});
 document.querySelectorAll("[data-t]").forEach(b=>{const k=b.dataset.t,n=items(k).filter(i=>!S.done[i.id]).length;b.className=k===tab?"on":"";b.innerHTML=esc(t[k])+(n?` <span class="n">${n}</span>`:"")});
 $("#showDone").textContent=showDone?t.hideDone:t.showDone;
 let L=items(tab);if(tab==="renew")L=[...L].sort((a,b)=>a.due.localeCompare(b.due));if(!showDone)L=L.filter(i=>!S.done[i.id]);
 if(!L.length){$("#list").innerHTML=`<div class="empty">${t.empty}</div>`;return}
 $("#list").innerHTML=L.map(i=>{const d=S.done[i.id],meta=tab==="book"?`${t.at}: ${esc(i.time)} · ${esc(i.what)}`:tab==="renew"?`${t.due}: ${new Date(i.due+"T12:00").toLocaleDateString(lang==="es"?"es-MX":"en-US",{month:"short",day:"numeric"})} · ${esc(i.what)}`:tab==="miss"?`${t.ago}: ${esc(i.when)}`:`${esc(i.what)} · ${esc(i.when)}`;
  return `<div class="card${d?" done":""}"><h3>${esc(i.name)}<span class="tag ${i.web?"w":"s"}">${i.web?t.web:t.sample}</span></h3><div class="meta">${meta}</div>
  <div class="acts"><a class="call" href="tel:+1${esc(i.phone)}">📞 ${t.cCall}</a><a class="text" href="sms:+1${esc(i.phone)}?body=${encodeURIComponent(t.sms)}">💬 ${t.cText}</a><button class="ok" data-done="${i.id}">${d?t.cUndo:t.cDone}</button></div>
  <textarea rows="2" data-note="${i.id}" placeholder="${t.note}">${esc(S.notes[i.id]||"")}</textarea><button class="mic" data-mic="${i.id}">${t.mic}</button></div>`}).join("")}
const $=s=>document.querySelector(s);
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const t=T[lang];
 if(b.dataset.t){tab=b.dataset.t;render()}
 else if(b.dataset.done){const id=b.dataset.done;S.done[id]?delete S.done[id]:S.done[id]=new Date().toISOString();save();render()}
 else if(b.dataset.mic){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert(t.noMic);return}
  if(rec){rec.stop();return}const id=b.dataset.mic,ta=document.querySelector(`[data-note="${id}"]`);rec=new SR();rec.lang=lang==="es"?"es-MX":"en-US";rec.interimResults=false;
  rec.onresult=ev=>{ta.value=(ta.value?ta.value+" ":"")+ev.results[0][0].transcript;S.notes[id]=ta.value;save()};
  rec.onend=()=>{rec=null;b.classList.remove("rec");b.textContent=t.mic};rec.onerror=()=>{};b.classList.add("rec");b.textContent=t.micStop;rec.start()}});
document.addEventListener("input",e=>{if(e.target.dataset.note){S.notes[e.target.dataset.note]=e.target.value;save()}});
$("#lang").onclick=()=>{lang=lang==="es"?"en":"es";localStorage.setItem("cca-agent-lang",lang);render()};
$("#showDone").onclick=()=>{showDone=!showDone;render()};
$("#reset").onclick=()=>{if(confirm(T[lang].confirm)){S=SAMPLE();save();render()}};
$("#out").onclick=()=>{sessionStorage.removeItem("cca-agent-ok");location.reload()};
function enter(){$("#gate").hidden=true;$("#app").hidden=false;load();render()}
$("#go").onclick=()=>{if($("#pin").value===PASSCODE){sessionStorage.setItem("cca-agent-ok","1");enter()}else $("#perr").textContent=T[lang].bad};
$("#pin").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
document.querySelectorAll("#gate [data-i]").forEach(e=>e.textContent=T[lang][e.dataset.i]);
if(sessionStorage.getItem("cca-agent-ok"))enter();
</script></body></html>
