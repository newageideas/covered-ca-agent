<script>const DOC={
es:{title:"Política de privacidad",sections:[["Quién somos","{AGENT}, agente de seguros certificado de {AGENCY}. No somos Covered California ni el gobierno."],["Qué datos recogemos","Solo lo que usted escribe en el formulario: nombre, teléfono, motivo, día y hora preferidos y una nota opcional. También datos técnicos básicos (fecha, hora, navegador). NO pedimos Seguro Social, estatus migratorio, ingresos ni información de salud en este sitio."],["Para qué los usamos","Solo para llamarle y ayudarle con su seguro de salud."],["No compartimos su teléfono","No vendemos, rentamos ni compartimos su número de teléfono ni sus datos con otras empresas para publicidad."],["Mensajes de texto","Hoy no enviamos mensajes de texto automáticos. Si en el futuro lo hacemos, será solo con su permiso, y podrá responder STOP para cancelar."],["Cuánto tiempo guardamos sus datos","Solo el tiempo necesario para atenderle o el que exija la ley."],["Borrar sus datos","Puede pedir que borremos sus datos llamando o escribiendo a {CONTACT}. Responderemos en un plazo razonable."],["Contacto","{AGENCY} · {CONTACT}"]]},
en:{title:"Privacy Policy",sections:[["Who we are","{AGENT}, certified insurance agent with {AGENCY}. We are not Covered California or the government."],["What we collect","Only what you type in the form: name, phone, reason, preferred day/time and an optional note, plus basic technical data (date, time, browser). We do NOT ask for Social Security numbers, immigration status, income or health information on this site."],["How we use it","Only to call you back and help with your health insurance."],["We do not share your phone number","We never sell, rent or share your phone number or information with other companies for marketing."],["Text messages","We do not send automated texts today. If we do in the future, it will only be with your permission, and you can reply STOP to opt out."],["How long we keep it","Only as long as needed to help you or as required by law."],["Delete your information","Ask us to delete your data by calling or writing to {CONTACT}. We will respond within a reasonable time."],["Contact","{AGENCY} · {CONTACT}"]]},
pa:{title:"ਪਰਦੇਦਾਰੀ ਨੀਤੀ",sections:[["ਅਸੀਂ ਕੌਣ ਹਾਂ","{AGENT}, {AGENCY} ਦੀ ਸਰਟੀਫਾਈਡ ਬੀਮਾ ਏਜੰਟ। ਅਸੀਂ Covered California ਜਾਂ ਸਰਕਾਰ ਨਹੀਂ ਹਾਂ।"],["ਅਸੀਂ ਕੀ ਜਾਣਕਾਰੀ ਲੈਂਦੇ ਹਾਂ","ਸਿਰਫ਼ ਜੋ ਤੁਸੀਂ ਫਾਰਮ ਵਿੱਚ ਲਿਖਦੇ ਹੋ: ਨਾਮ, ਫ਼ੋਨ, ਕਾਰਨ, ਦਿਨ/ਸਮਾਂ ਅਤੇ ਨੋਟ, ਅਤੇ ਬੁਨਿਆਦੀ ਤਕਨੀਕੀ ਜਾਣਕਾਰੀ। ਅਸੀਂ Social Security ਨੰਬਰ, ਇਮੀਗ੍ਰੇਸ਼ਨ ਸਥਿਤੀ, ਆਮਦਨ ਜਾਂ ਸਿਹਤ ਜਾਣਕਾਰੀ ਨਹੀਂ ਮੰਗਦੇ।"],["ਅਸੀਂ ਇਸਨੂੰ ਕਿਵੇਂ ਵਰਤਦੇ ਹਾਂ","ਸਿਰਫ਼ ਤੁਹਾਨੂੰ ਵਾਪਸ ਕਾਲ ਕਰਨ ਅਤੇ ਸਿਹਤ ਬੀਮੇ ਵਿੱਚ ਮਦਦ ਲਈ।"],["ਅਸੀਂ ਤੁਹਾਡਾ ਫ਼ੋਨ ਨੰਬਰ ਸਾਂਝਾ ਨਹੀਂ ਕਰਦੇ","ਅਸੀਂ ਤੁਹਾਡਾ ਨੰਬਰ ਜਾਂ ਜਾਣਕਾਰੀ ਕਦੇ ਨਹੀਂ ਵੇਚਦੇ ਜਾਂ ਮਸ਼ਹੂਰੀ ਲਈ ਸਾਂਝੀ ਨਹੀਂ ਕਰਦੇ।"],["ਟੈਕਸਟ ਸੁਨੇਹੇ","ਹੁਣ ਅਸੀਂ ਆਟੋਮੈਟਿਕ ਟੈਕਸਟ ਨਹੀਂ ਭੇਜਦੇ। ਭਵਿੱਖ ਵਿੱਚ ਸਿਰਫ਼ ਤੁਹਾਡੀ ਇਜਾਜ਼ਤ ਨਾਲ, ਅਤੇ ਬੰਦ ਕਰਨ ਲਈ STOP ਭੇਜ ਸਕਦੇ ਹੋ।"],["ਕਿੰਨਾ ਸਮਾਂ ਰੱਖਦੇ ਹਾਂ","ਸਿਰਫ਼ ਜਿੰਨਾ ਲੋੜੀਂਦਾ ਹੈ ਜਾਂ ਕਾਨੂੰਨ ਮੰਗਦਾ ਹੈ।"],["ਜਾਣਕਾਰੀ ਮਿਟਾਉਣਾ","{CONTACT} ਤੇ ਕਾਲ ਕਰਕੇ ਜਾਂ ਲਿਖ ਕੇ ਆਪਣੀ ਜਾਣਕਾਰੀ ਮਿਟਾਉਣ ਲਈ ਕਹੋ।"],["ਸੰਪਰਕ","{AGENCY} · {CONTACT}"]]}};</script><script src="/legal.js"></script></body></html>
