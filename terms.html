<script>const DOC={
es:{title:"Términos de uso",sections:[["Sobre este sitio","Sitio de {AGENT} / {AGENCY}, agente de seguros independiente certificado para vender planes de Covered California. No es un sitio oficial de Covered California ni del gobierno."],["Información general","La información aquí es general y en lenguaje sencillo. No es consejo legal, fiscal ni médico. Los precios, ayudas y fechas pueden cambiar; confirme con nosotros o en CoveredCA.com."],["Sin costo","Nuestra ayuda no le cuesta. Los agentes reciben pago de la aseguradora."],["Su solicitud","Enviar el formulario no lo inscribe en ningún plan. Solo pide que le llamemos."],["Mensajes de texto","Hoy no enviamos textos automáticos. Si se activan en el futuro, serán opcionales y podrá cancelar con STOP."],["Cambios","Podemos actualizar estos términos. La fecha de arriba muestra la última versión."],["Contacto","{AGENCY} · {CONTACT}"]]},
en:{title:"Terms of Use",sections:[["About this site","Site of {AGENT} / {AGENCY}, an independent insurance agent certified to sell Covered California plans. Not an official Covered California or government site."],["General information","Information here is general and in plain language. It is not legal, tax or medical advice. Prices, help and dates can change; confirm with us or at CoveredCA.com."],["No cost","Our help is free to you. Agents are paid by the insurance company."],["Your request","Submitting the form does not enroll you in any plan. It only asks us to call you."],["Text messages","We do not send automated texts today. If enabled in the future they will be optional and you can reply STOP."],["Changes","We may update these terms. The date above shows the latest version."],["Contact","{AGENCY} · {CONTACT}"]]},
pa:{title:"ਵਰਤੋਂ ਦੀਆਂ ਸ਼ਰਤਾਂ",sections:[["ਇਸ ਸਾਈਟ ਬਾਰੇ","{AGENT} / {AGENCY} ਦੀ ਸਾਈਟ, Covered California ਪਲਾਨ ਵੇਚਣ ਲਈ ਸਰਟੀਫਾਈਡ ਸੁਤੰਤਰ ਏਜੰਟ। ਇਹ ਸਰਕਾਰੀ ਸਾਈਟ ਨਹੀਂ ਹੈ।"],["ਆਮ ਜਾਣਕਾਰੀ","ਇਹ ਜਾਣਕਾਰੀ ਆਮ ਹੈ, ਕਾਨੂੰਨੀ, ਟੈਕਸ ਜਾਂ ਡਾਕਟਰੀ ਸਲਾਹ ਨਹੀਂ। ਕੀਮਤਾਂ ਅਤੇ ਤਾਰੀਖਾਂ ਬਦਲ ਸਕਦੀਆਂ ਹਨ।"],["ਕੋਈ ਖਰਚਾ ਨਹੀਂ","ਸਾਡੀ ਮਦਦ ਮੁਫ਼ਤ ਹੈ। ਏਜੰਟਾਂ ਨੂੰ ਬੀਮਾ ਕੰਪਨੀ ਭੁਗਤਾਨ ਕਰਦੀ ਹੈ।"],["ਤੁਹਾਡੀ ਬੇਨਤੀ","ਫਾਰਮ ਭੇਜਣ ਨਾਲ ਤੁਸੀਂ ਕਿਸੇ ਪਲਾਨ ਵਿੱਚ ਦਾਖਲ ਨਹੀਂ ਹੁੰਦੇ, ਸਿਰਫ਼ ਕਾਲ ਦੀ ਬੇਨਤੀ ਹੈ।"],["ਟੈਕਸਟ ਸੁਨੇਹੇ","ਹੁਣ ਆਟੋਮੈਟਿਕ ਟੈਕਸਟ ਨਹੀਂ ਭੇਜੇ ਜਾਂਦੇ। ਭਵਿੱਖ ਵਿੱਚ ਇਹ ਵਿਕਲਪਿਕ ਹੋਣਗੇ।"],["ਬਦਲਾਅ","ਅਸੀਂ ਇਹ ਸ਼ਰਤਾਂ ਅਪਡੇਟ ਕਰ ਸਕਦੇ ਹਾਂ।"],["ਸੰਪਰਕ","{AGENCY} · {CONTACT}"]]}};</script><script src="/legal.js"></script></body></html>
