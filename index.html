whyH:"ਮੇਰੇ ਨਾਲ ਕਿਉਂ",w1:"ਤੁਹਾਡੀ ਭਾਸ਼ਾ",w1d:"Español, English ਅਤੇ ਪੰਜਾਬੀ।",w2:"ਕੋਈ ਖਰਚਾ ਨਹੀਂ",w2d:"ਸਰਟੀਫਾਈਡ ਏਜੰਟਾਂ ਨੂੰ ਬੀਮਾ ਕੰਪਨੀ ਭੁਗਤਾਨ ਕਰਦੀ ਹੈ, ਤੁਸੀਂ ਨਹੀਂ।",w3:"ਸਾਰਾ ਸਾਲ",w3d:"ਰੀਨਿਊ ਤੋਂ ਪਹਿਲਾਂ ਯਾਦ ਕਰਾਉਂਦੀ ਹਾਂ ਅਤੇ ਬਦਲਾਅ ਵੇਲੇ ਮਦਦ ਕਰਦੀ ਹਾਂ।",
banner:(e,f)=>`ਓਪਨ ਐਨਰੋਲਮੈਂਟ: ${e} ਤੱਕ। 1 ਜਨਵਰੀ ਤੋਂ ਕਵਰੇਜ ਲਈ ${f} ਤੱਕ ਦਾਖਲਾ ਲਓ।`,bannerOff:"ਓਪਨ ਐਨਰੋਲਮੈਂਟ ਬੰਦ ਹੈ। ਜ਼ਿੰਦਗੀ ਵਿੱਚ ਬਦਲਾਅ (ਨੌਕਰੀ, ਘਰ ਬਦਲਣਾ, ਬੱਚਾ) ਤੋਂ ਬਾਅਦ ਯੋਗ ਹੋ ਸਕਦੇ ਹੋ।",
disc:"Covered California ਪਲਾਨ ਵੇਚਣ ਲਈ ਸਰਟੀਫਾਈਡ ਸੁਤੰਤਰ ਬੀਮਾ ਏਜੰਟ। ਇਹ ਸਾਈਟ Covered California ਜਾਂ ਸਰਕਾਰ ਦੀ ਨਹੀਂ ਹੈ।",trans:"ਡੈਮੋ ਅਨੁਵਾਦ — ਮੂਲ ਬੋਲਣ ਵਾਲੇ ਤੋਂ ਜਾਂਚ ਦੀ ਲੋੜ।",sCall:"📞 ਕਾਲ",sText:"💬 ਟੈਕਸਟ",sBook:"📅 ਸਮਾਂ",pp:"ਪਰਦੇਦਾਰੀ",tos:"ਸ਼ਰਤਾਂ"}};
const LOC={es:"es-MX",en:"en-US",pa:"pa-IN"},KEY="cca-lead-v1",$=s=>document.querySelector(s);
let lang=localStorage.getItem("cca-lang")||"es";
const fmt=(d,l)=>new Date(d+"T12:00:00").toLocaleDateString(LOC[l],{month:"long",day:"numeric",year:"numeric"});
function render(){const t=T[lang];document.documentElement.lang=lang==="pa"?"pa":lang;
 document.querySelectorAll("[data-i]").forEach(el=>{const v=t[el.dataset.i];if(typeof v==="string")el.textContent=v});
 document.querySelectorAll("[data-cfg]").forEach(el=>el.textContent=CONFIG[el.dataset.cfg]);
 $("header .brand small").textContent=t.cert+" · "+CONFIG.certId;
 document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 $("#bring").innerHTML="";t.bring.forEach(x=>{const li=document.createElement("li");li.textContent=x;$("#bring").appendChild(li)});
 const fill=(sel,arr)=>{const cur=sel.selectedIndex;sel.innerHTML="";arr.forEach((x,i)=>sel.add(new Option(x,String(i))));if(cur>=0)sel.selectedIndex=cur};
 fill($("#reason"),t.reasons);fill($("#time"),t.times);
 if($("#consentText"))$("#consentText").textContent=t.consent(CONFIG.agency);
 const today=new Date().toISOString().slice(0,10);
 $("#oeBanner").textContent=today<=CONFIG.oeEnd&&today>=CONFIG.oeStart?t.banner(fmt(CONFIG.oeEnd,lang),fmt(CONFIG.fullYearBy,lang)):t.bannerOff;
 document.title=t.cert+" · Atwater & Livingston"}
document.querySelectorAll("[data-tel]").forEach(a=>a.href="tel:+1"+CONFIG.phone);
document.querySelectorAll("[data-sms]").forEach(a=>a.href="sms:+1"+CONFIG.textPhone);
if(CONFIG.bookingLink)document.querySelectorAll('a[href="#form"]').forEach(a=>{a.href=CONFIG.bookingLink;a.target="_blank";a.rel="noopener"});
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem("cca-lang",lang);render()});
const f=$("#lead"),fields=["name","phone","reason","day","time","notes"];
$("#day").min=new Date().toISOString().slice(0,10);
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");fields.forEach(k=>{if(s[k]!=null)f[k].value=s[k]})}catch{}
f.addEventListener("input",()=>{const s={};fields.forEach(k=>s[k]=f[k].value);localStorage.setItem(KEY,JSON.stringify(s))});
f.addEventListener("submit",async e=>{e.preventDefault();const m=$("#msg"),t=T[lang];m.className="msg";
 const phone=f.phone.value.replace(/\D/g,"");if(!f.name.value.trim()||!(phone.length===10||(phone.length===11&&phone[0]==="1"))){m.textContent=t.err;m.className="msg err";return}
 const body={name:f.name.value,phone,reason:T.en.reasons[f.reason.value],day:f.day.value,time:T.en.times[f.time.value],notes:f.notes.value,website:f.website.value,lang,
  smsConsent:!!($("#sms")&&$("#sms").checked),consentText:$("#sms")&&$("#sms").checked?$("#consentText").textContent:"",source:"website-lead-form:"+location.hostname};
 try{const r=await fetch("/api/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();
  if(!j.ok)throw 0;try{const L=JSON.parse(localStorage.getItem("cca-leads")||"[]");L.unshift({...body,website:undefined,id:Date.now(),at:new Date().toISOString(),done:false});localStorage.setItem("cca-leads",JSON.stringify(L.slice(0,50)))}catch{}m.textContent=t.ok;m.className="msg ok";localStorage.removeItem(KEY);f.reset();render()}catch{m.textContent=t.fail;m.className="msg err"}});
if(!CONFIG.SMS_ENABLED){$("#smsWrap").remove()}
render();
</script></body></html>
